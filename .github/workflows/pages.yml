name: Publish static site
on:
  push:
    branches: [main]
  schedule:
    # อัปเดตสำเนาจุดความร้อนจาก API ระบบ Agri-Risk Map ทุกวัน 09:00 และ 12:00 น. (เวลาไทย = UTC+7)
    - cron: '0 2,5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application
        run: npm test
      - name: Prepare public website
        run: |
          mkdir _site
          cp *.html *.css *.js .nojekyll _site/
          cp -R assets data risk _site/
      - name: Snapshot HS points from Agri-Risk Map API
        run: node scripts/build-hs-snapshot.js _site/data/hs
        timeout-minutes: 30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
