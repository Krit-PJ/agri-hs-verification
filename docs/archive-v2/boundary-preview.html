<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>ตัวอย่างขอบเขตตามสิทธิ์ — ทดสอบในเครื่อง</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="boundaries.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><main style="max-width:1100px;margin:auto;padding:16px"><h1>ขอบเขตจังหวัด อำเภอ และตำบล</h1><p>ตัวอย่างในเครื่อง · ใช้ข้อมูลแผนที่จริงและสิทธิ์จำลอง ไม่เชื่อมฐานข้อมูล HS หรือให้สิทธิ์ระบบจริง</p><label>ทดสอบมุมมอง<select id="testRole"><option value="admin:62">Admin · กำแพงเพชร</option><option value="admin:50">Admin · เชียงใหม่</option><option value="super_admin:">Super Admin · ทั้งประเทศ</option><option value="public:">ผู้ใช้ทั่วไป · ไม่แสดงชั้นขอบเขตผู้ดูแล</option></select></label><section id="boundaryPanel" class="boundary-panel" hidden></section><div id="map" style="height:550px"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="boundaries.js"></script><script>
if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)){document.body.textContent='ตัวอย่างนี้เปิดได้เฉพาะในเครื่อง';}else{const map=L.map('map').setView([16.4,99.52],9);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const picker=document.getElementById('testRole');let profile={role:'admin',assignedProvinceCode:'62'};const layer=HSBoundaries.create({map,L,panel:document.getElementById('boundaryPanel'),profile:()=>profile,valid:()=>true});picker.onchange=()=>{const [role,assignedProvinceCode]=picker.value.split(':');profile={role,assignedProvinceCode};layer.sync();};layer.sync();}
</script></body></html>
